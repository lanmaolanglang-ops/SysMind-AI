[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sysmind-backend"
version = "0.1.1"
description = "Local FastAPI sidecar for SysMind AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "psutil>=6.1,<8",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=9,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-psutil>=7.0,<8",
]
packaging = [
  "pyinstaller>=6.16,<7",
]

[project.scripts]
sysmind-backend = "sysmind.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sysmind"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = [
    "windows_smoke: read-only integration checks against the current Windows host",
    "destructive_sandbox: state-changing checks allowed only in an explicitly acknowledged Windows Sandbox/VM",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sysmind"]
