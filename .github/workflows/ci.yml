name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: python -m pip install -e "services/backend[dev]"
      - run: ruff check services/backend
      - run: mypy services/backend/src
      - run: pytest services/backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "services/backend[dev]"
      - run: pytest services/backend/tests/test_runtime.py services/backend/tests/test_health.py services/backend/tests/test_windows_diagnostics.py
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
