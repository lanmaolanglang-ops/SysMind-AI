name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml
      - run: python -m pip install -e "services/backend[dev,packaging]"
      - run: ruff check services/backend
      - run: mypy --config-file services/backend/pyproject.toml services/backend/src
      - run: pytest --cov=sysmind --cov-report=term-missing --cov-fail-under=70 services/backend
      - run: python scripts/export-openapi.py
      - run: git diff --exit-code -- contracts/openapi/sysmind-local-api.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "services/backend[dev,packaging]"
      - run: pytest services/backend/tests/test_runtime.py services/backend/tests/test_health.py services/backend/tests/test_windows_diagnostics.py
      - run: python -m PyInstaller --noconfirm --clean --distpath services/backend/packaging/dist --workpath services/backend/packaging/build services/backend/packaging/sysmind-backend.spec
      - run: python scripts/test_packaged_backend.py services/backend/packaging/dist/sysmind-backend
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m venv services/backend/.venv
      - run: services/backend/.venv/Scripts/python.exe -m pip install -e "services/backend[dev,packaging]"
      - run: pnpm install --frozen-lockfile
      - run: .\scripts\package.ps1 -Version 0.1.0 -SkipChecks
      - run: .\scripts\run-phase6-isolated-tests.ps1 -InstallerPath "apps/desktop/src-tauri/target/release/bundle/nsis/SysMind AI_0.1.0_x64-setup.exe" -ConfirmIsolatedEnvironment
